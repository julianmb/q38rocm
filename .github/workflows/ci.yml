name: CI & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install aiohttp requests

      - name: Python compile and syntax validation
        run: |
          python3 -m py_compile scripts/*.py

      - name: Python tests (hybrid pipeline)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Shell script syntax check
        run: |
          bash -n setup_env.sh run_server.sh quickstart.sh build_engine.sh download_model.sh apply_hardware_tweaks.sh

      - name: Shell test suites
        run: |
          bash tests/test_run_server_args.sh
          bash tests/test_cache_profile.sh
          bash tests/test_build_engine_flags.sh
