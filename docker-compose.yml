services:
  # Standalone Qwen 3.8 27B Server (Default: docker compose up -d)
  # Works on Linux & Windows (Docker Desktop with WSL2 backend)
  qwen38-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/julianmb/q38rocm:latest
    container_name: qwen38-strix-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HIP_VISIBLE_DEVICES=0
      - AMD_VULKAN_ICD=RADV
      - RADV_PERFTEST=gpl,sam,nggc
      - CTX=262144
      - PORT=8000
      # For Strix Halo APU, uncomment:
      # - HSA_OVERRIDE_GFX_VERSION=11.5.1
      # - GGML_HIP_ENABLE_UNIFIED_MEMORY=1
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
      # If using AMD XDNA NPU on Strix Halo, uncomment:
      # - /dev/accel/accel0:/dev/accel/accel0
    group_add:
      - video
      - render
    volumes:
      - ./Qwen3.8-27B-ROCmFP4-FAST.gguf:/app/models/Qwen3.8-27B-ROCmFP4-FAST.gguf:ro
      - ./models:/app/models
      - hf-cache:/root/.cache/huggingface/hub
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional Open WebUI Chat Interface (Launch via: docker compose --profile webui up -d)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: qwen38-open-webui
    restart: unless-stopped
    profiles:
      - webui
      - all
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://qwen38-server:8000/v1
      - OPENAI_API_KEY=sk-no-key
      - DEFAULT_MODELS=qwen38-27b
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      qwen38-server:
        condition: service_healthy

volumes:
  hf-cache:
  open-webui-data:
